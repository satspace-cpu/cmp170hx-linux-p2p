  </g>
  <g stroke="#30363d" stroke-width="1"><line x1="80" y1="356" x2="870" y2="356"/><line x1="80" y1="292" x2="870" y2="292"/><line x1="80" y1="228" x2="870" y2="228"/><line x1="80" y1="164" x2="870" y2="164"/><line x1="80" y1="100" x2="870" y2="100"/></g>
