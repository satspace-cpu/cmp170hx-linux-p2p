<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">CMP 170HX Gen4 x16 host transfer bandwidth</title>
  <desc id="desc">Grouped bars for host to device and device to host bandwidth across four 80 GiB CMP 170HX GPUs.</desc>
  <rect width="920" height="500" fill="#0d1117" rx="16"/>
  <text x="460" y="38" fill="#f0f6fc" font-family="sans-serif" font-size="24" text-anchor="middle">4× CMP 170HX 80 GiB — PCIe Gen4 x16</text>
  <text x="460" y="65" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">Pinned 256 MiB copies, 20 iterations · GiB/s</text>
  <line x1="80" y1="420" x2="870" y2="420" stroke="#8b949e"/>
  <line x1="80" y1="100" x2="80" y2="420" stroke="#8b949e"/>
