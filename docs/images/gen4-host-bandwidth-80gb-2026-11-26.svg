    <rect x="320" y="108" width="56" height="312" fill="#2f81f7" rx="4"/><rect x="382" y="138" width="56" height="282" fill="#3fb950" rx="4"/>
    <rect x="510" y="108" width="56" height="312" fill="#2f81f7" rx="4"/><rect x="572" y="130" width="56" height="290" fill="#3fb950" rx="4"/>
    <rect x="700" y="108" width="56" height="312" fill="#2f81f7" rx="4"/><rect x="762" y="128" width="56" height="292" fill="#3fb950" rx="4"/>
