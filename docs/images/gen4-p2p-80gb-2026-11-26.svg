<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">CMP 170HX Gen4 x16 P2P bandwidth</title>
  <desc id="desc">Average and range of one-way, bidirectional and post-reboot bidirectional P2P bandwidth across twelve directed GPU pairs.</desc>
  <rect width="920" height="500" fill="#0d1117" rx="16"/>
  <text x="460" y="38" fill="#f0f6fc" font-family="sans-serif" font-size="24" text-anchor="middle">4× CMP 170HX — CUDA P2P over Gen4 x16</text>
  <text x="460" y="65" fill="#8b949e" font-family="sans-serif" font-size="14" text-anchor="middle">12 directed peer pairs · GB/s</text>
  <line x1="90" y1="420" x2="870" y2="420" stroke="#8b949e"/><line x1="90" y1="100" x2="90" y2="420" stroke="#8b949e"/>
  <g fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="end"><text x="80" y="424">0</text><text x="80" y="360">10</text><text x="80" y="296">20</text><text x="80" y="232">30</text><text x="80" y="168">40</text><text x="80" y="104">50</text></g>
  <g stroke="#30363d"><line x1="90" y1="356" x2="870" y2="356"/><line x1="90" y1="292" x2="870" y2="292"/><line x1="90" y1="228" x2="870" y2="228"/><line x1="90" y1="164" x2="870" y2="164"/><line x1="90" y1="100" x2="870" y2="100"/></g>
  <rect x="155" y="255" width="140" height="165" fill="#2f81f7" rx="7"/><rect x="390" y="115" width="140" height="305" fill="#a371f7" rx="7"/><rect x="625" y="113" width="140" height="307" fill="#3fb950" rx="7"/>
  <g fill="#f0f6fc" font-family="sans-serif" text-anchor="middle"><text x="225" y="242" font-size="22">25.76</text><text x="460" y="102" font-size="22">47.66</text><text x="695" y="100" font-size="22">47.89</text></g>
  <g fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle"><text x="225" y="274">25.32–26.00</text><text x="460" y="134">46.84–48.50</text><text x="695" y="132">47.18–49.11</text></g>
  <g fill="#c9d1d9" font-family="sans-serif" font-size="14" text-anchor="middle"><text x="225" y="447">One-way P2P</text><text x="460" y="447">Bidirectional P2P</text><text x="695" y="447">After reboot</text></g>
  <text x="460" y="480" fill="#8b949e" font-family="sans-serif" font-size="13" text-anchor="middle">Bars show mean; labels inside bars show min–max</text>
</svg>
