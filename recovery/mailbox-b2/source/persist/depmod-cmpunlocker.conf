# cmpunlocker - make the patched modules win over the distro's stock nvidia.
#
# The stock driver is rebuilt automatically on every kernel update and lands in
# a directory depmod also searches:
#
#   extra/            akmod   (Fedora, RHEL)
#   updates/dkms/     dkms    (Debian, Ubuntu, HiveOS, Arch)
#
# Both sit alongside updates/cmpunlocker/, so which nvidia.ko modprobe resolves
# to would otherwise depend on depmod's search order. These lines make it
# explicit: the patched build always wins.
override nvidia * updates/cmpunlocker
override nvidia-modeset * updates/cmpunlocker
override nvidia-uvm * updates/cmpunlocker
override nvidia-drm * updates/cmpunlocker
override nvidia-peermem * updates/cmpunlocker
