# cmpunlocker - keep nouveau from claiming the card.
#
# nouveau cannot drive a CMP 170HX usefully and binding it means the patched
# driver cannot attach. The distro nvidia packages ship the same blacklist;
# this file makes it independent of them, so removing or reinstalling the
# stock package cannot take it away.
#
# Note that blacklisting only blocks automatic (alias-driven) loading. The
# explicit "modprobe nouveau" that nvidia-fallback.service runs is stopped by
# masking that unit, which install.sh does separately.
blacklist nouveau
blacklist nova_core
